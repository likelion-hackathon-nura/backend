spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3308/nura?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:nura}
    password: ${DB_PASSWORD:nura1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

    open-in-view: false

jwt:
  secret: ${JWT_SECRET:nura-local-development-jwt-secret-key-change-me}

cors:
  allowed-origins: http://localhost:3000,http://localhost:5173

logging:
  level:
    root: info
    org.hibernate.SQL: debug

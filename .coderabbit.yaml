# ---------------------------------------------------------------- #
# CodeRabbit AI 설정
# ---------------------------------------------------------------- #

language: "ko-KR"

tone_instructions: >
  Spring Boot 백엔드 프로젝트입니다.
  계층 구조, JPA 사용, 예외 처리, 성능, 보안, API 설계를 중점적으로 리뷰해주세요.
  개선이 필요한 경우에는 이유와 함께 대안을 제안해주세요.

# ---------------------------------------------------------------- #
# 코드 리뷰 설정
# ---------------------------------------------------------------- #

reviews:
  profile: "chill"

  high_level_summary: true
  changed_files_summary: true
  collapse_walkthrough: true

  auto_review:
    enabled: true
    auto_incremental_review: true

  poem: false

# ---------------------------------------------------------------- #
# Chat 설정
# ---------------------------------------------------------------- #

chat:
  auto_reply: true

# ---------------------------------------------------------------- #
# Knowledge Base
# ---------------------------------------------------------------- #

knowledge_base:
  web_search:
    enabled: true